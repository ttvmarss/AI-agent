[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-os"
version = "0.1.0"
description = "PRAXIS: an event-sourced executive kernel that turns outcomes into verified results across Claude, Codex, Factory Droid, Devin and Ollama."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []   # standard library only, by design

[project.optional-dependencies]
voice = ["faster-whisper>=1.0", "piper-tts>=1.2", "sounddevice>=0.4"]   # hands-free: speak to it, it speaks back (all local)
ui = ["PySide6-Essentials>=6.7"]   # the command-center window; without it PRAXIS falls back to a basic Tk window

[project.scripts]
praxis = "praxis.__main__:main"

[project.gui-scripts]
praxis-desktop = "praxis.desktop.__main__:main"   # pip creates praxis-desktop.exe on Windows (no console window)

[tool.setuptools]
packages = ["praxis", "praxis.desktop", "praxis.desktop.qt", "praxis.desktop.qt.hud", "praxis.voice", "praxis.ui"]

[tool.setuptools.package-data]
"praxis.desktop.qt.hud" = ["*.json"]       # the shipped HUD design
"praxis.ui" = ["static/*", "static/assets/*"]   # the built web interface
