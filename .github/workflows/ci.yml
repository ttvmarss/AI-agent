name: ci
on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}   # the Windows run is informational until it has been seen green
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Engine tests (kernel, guard, voice logic, local server)
        run: python -m unittest discover -s tests -q

  interface:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build (the committed build must match the source)
        run: |
          npm run build
          git diff --exit-code -- ../praxis/ui/static || (echo "praxis/ui/static is stale: run 'npm run build' in ui/ and commit it" && exit 1)
      - name: Browser end-to-end (the real interface against the real engine)
        run: |
          sudo apt-get update && sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          CHROME_PATH=$(command -v chromium-browser || command -v chromium) npm run e2e
