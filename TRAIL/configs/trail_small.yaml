# Serious small-language-model training. Needs a GPU (>= 12 GB).
name: trail-small
generation: 1
seed: 1337

model:
  n_layers: 12
  d_model: 768
  n_heads: 12
  n_kv_heads: 4
  max_seq_len: 1024
  rope_theta: 10000.0
  tie_embeddings: true

tokenizer:
  vocab_size: 16384

data:
  sources: [datasets/raw]
  output: datasets/processed/trail_small
  mixture: {language: 0.30, code: 0.25, mathematics: 0.15, science: 0.15, technical: 0.10, structured_data: 0.05}
  val_fraction: 0.02

training:
  run_dir: checkpoints/trail-small
  seq_len: 1024
  batch_size: 16
  max_steps: 100000
  lr: 6.0e-4
