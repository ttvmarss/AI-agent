# Large distributed training. Cluster class hardware.
name: trail-large
generation: 1
seed: 1337

model:
  n_layers: 48
  d_model: 5120
  n_heads: 40
  n_kv_heads: 8
  max_seq_len: 8192
  rope_theta: 10000.0
  tie_embeddings: true

tokenizer:
  vocab_size: 65535

data:
  sources: [datasets/raw]
  output: datasets/processed/trail_large
  mixture: {language: 0.30, code: 0.25, mathematics: 0.15, science: 0.15, technical: 0.10, structured_data: 0.05}
  val_fraction: 0.02

training:
  run_dir: checkpoints/trail-large
  seq_len: 8192
  batch_size: 4
  max_steps: 600000
  lr: 2.0e-4
